[project]
name = "metamorph-engine"
version = "0.0.0"
description = "High-speed real-time voice cloning, full-body swap, and video editing GPU inference server."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httptools>=0.6.4",
  "httpx>=0.28.0",
  "numpy>=2.0.0",
  "pillow>=11.0.0",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34.0",
  "uvloop>=0.21.0",
  "websockets>=14.0",
]

[project.optional-dependencies]
gpu = [
  "av>=13.1.0",
  "diffusers>=0.37.0",
  "einops>=0.8.0",
  "huggingface-hub>=0.28.1",
  "librosa>=0.10.2",
  "munch>=4.0.0",
  "opencv-python-headless>=4.11.0",
  "pyyaml>=6.0.2",
  "scipy>=1.13.0",
  "soundfile>=0.12.1",
  "torch>=2.9.0",
  "torchaudio>=2.9.0",
  "torchvision>=0.24.0",
  "transformers>=4.46.0",
]

[project.scripts]
metamorph-engine = "metamorph_engine.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_engine"]
