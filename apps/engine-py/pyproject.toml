[project]
name = "metamorph-engine"
version = "0.0.0"
description = "High-speed real-time voice cloning, full-body swap, and video editing inference server for RunPod."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httptools>=0.6.4",
  "metamorph-shared",
  "pydantic-settings>=2.7.0",
  "uvicorn>=0.34.0",
  "uvloop>=0.21.0",
  "websockets>=14.0",
]

[project.scripts]
metamorph-engine = "metamorph_engine.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_engine"]

[tool.uv.sources]
metamorph-shared = { workspace = true }
